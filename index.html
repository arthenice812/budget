<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мой Бюджет">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.json">
<title>💜 Мой Бюджет</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --p:#7c3aed;--pl:#ede9fe;--pd:#5b21b6;
  --g:#059669;--gl:#d1fae5;
  --r:#dc2626;--rl:#fee2e2;
  --o:#d97706;--ol:#fef3c7;
  --gray:#6b7280;--gl2:#f3f4f6;--border:#e5e7eb;
  --text:#111827;--muted:#6b7280;
  --nav:64px;--hdr:56px;
  --shadow:0 1px 3px rgba(0,0,0,.1);
  --bg:#f0f0f8;--card:#fff;--inp:#fff;--nav-bg:#fff;
  /* ── Категориальная палитра для графиков (проверена скриптом на CVD/контраст) ── */
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;
  --c5:#e87ba4;--c6:#008300;--c7:#4a3aa7;--c8:#e34948;
  --chart-grid:#e1e0d9;--chart-axis:#c3c2b7;
}
/* ── Цветовые темы ── */
.th-blue  {--p:#2563eb;--pl:#dbeafe;--pd:#1d4ed8;--bg:#f0f4ff}
.th-green {--p:#059669;--pl:#d1fae5;--pd:#047857;--bg:#f0fdf4}
.th-pink  {--p:#db2777;--pl:#fce7f3;--pd:#be185d;--bg:#fff0f6}
.th-orange{--p:#ea580c;--pl:#ffedd5;--pd:#c2410c;--bg:#fff8f0}
.th-teal  {--p:#0891b2;--pl:#cffafe;--pd:#0e7490;--bg:#f0faff}
/* ── Тёмная тема ── */
.dark{
  --bg:#0f172a;--card:#1e293b;--inp:#0f172a;--nav-bg:#1a2540;
  --text:#f1f5f9;--muted:#94a3b8;--border:#334155;
  --gl2:#1e293b;--shadow:0 1px 3px rgba(0,0,0,.5);
  --gl:#064e3b;--rl:#450a0a;--ol:#431407;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;
  --c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --chart-grid:#2c2c2a;--chart-axis:#383835;
}
.dark .card{background:var(--card)}
.dark #nav{background:var(--nav-bg);border-color:#334155}
.dark .ms,.dark .ob-overlay{background:var(--card)}
.dark .fc2,.dark .pi{background:var(--inp);border-color:#334155;color:var(--text)}
.dark .tg{background:#0f172a}
.dark .tb2.on{background:#334155}
.dark .mchip{background:#1e293b;border-color:#334155;color:var(--text)}
.dark .mchip.on{background:var(--p);border-color:var(--p)}
.dark .jftb{background:#1e293b;border-color:#334155;color:var(--text)}
.dark .dchip{background:#1e293b;border-color:#334155;color:var(--text)}
.dark .sc{background:#1e293b}
.dark .htbl th{background:#2d3748}
.dark .htbl td{border-color:#334155}
.dark select{background:var(--inp);color:var(--text);border-color:#334155}
.dark input[type=date]{background:var(--inp);color:var(--text)}
.dark .accrow input{background:var(--inp);color:var(--text)}
.dark .imp-upload-area{border-color:#334155;color:var(--muted)}
.dark .imp-summary{background:#2d3748}
.dark .fi input{background:var(--inp);border-color:#334155;color:var(--text)}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
@media(min-width:600px){body{display:flex;justify-content:center;align-items:flex-start}}

/* ── Layout ── */
#app{height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:600px){#app{max-width:430px;width:100%;box-shadow:0 0 60px rgba(0,0,0,.2);margin:0 auto}}

#hdr{
  height:var(--hdr);background:var(--p);color:#fff;
  display:flex;align-items:center;padding:0 16px;
  justify-content:space-between;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
#hdr h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
#hdr-btn{
  background:rgba(255,255,255,.18);border:none;color:#fff;
  border-radius:8px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;
}

#content{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:12px 12px calc(var(--nav)+80px);
}

#nav{
  height:var(--nav);background:var(--nav-bg);border-top:1px solid var(--border);
  display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100;
}
@media(min-width:600px){#nav{max-width:430px;left:50%;right:auto;transform:translateX(-50%);width:100%}}
.ntab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;color:var(--gray);
  transition:color .15s;font-size:10px;border:none;background:none;padding:4px;
}
.ntab.on{color:var(--p)}
.ntab .ic{font-size:21px;line-height:1}

/* ── Cards ── */
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-hd{font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}

/* ── Month chips ── */
.mchips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{
  flex-shrink:0;padding:6px 14px;border-radius:20px;
  border:1.5px solid var(--border);background:#fff;
  font-size:13px;cursor:pointer;color:var(--text);transition:all .15s;
}
.mchip.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}

/* ── Summary grid ── */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sc{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.sc .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.sc .val{font-size:20px;font-weight:800}
.sc .val.inc{color:var(--g)}
.sc .val.exp{color:var(--r)}
.sc .val.free{color:var(--p)}

/* ── Budget rows ── */
.brow{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;gap:6px}
.brow:last-child{border-bottom:none}
.brow.ttl{font-weight:700;padding-top:10px;background:none}
.brow .nm{flex:1;color:var(--text);min-width:0;word-break:break-word}
.brow .pl{width:72px;flex-shrink:0}
.brow .fc{width:76px;text-align:right;font-weight:500;flex-shrink:0}
.brow .fc.ov{color:var(--r)}
.brow .fc.ok{color:var(--g)}
.bcols{display:flex;font-size:11px;color:var(--muted);margin-bottom:4px;gap:6px}
.bcols .nm{flex:1}
.bcols .pl{width:72px;text-align:right}
.bcols .fc{width:76px;text-align:right}

/* plan input */
.pi{
  width:100%;border:1.5px solid var(--border);border-radius:6px;
  padding:4px 6px;font-size:13px;text-align:right;outline:none;color:var(--text);
}
.pi:focus{border-color:var(--p)}

/* progress */
.pb{height:3px;background:var(--gl2);border-radius:2px;overflow:hidden;margin-top:3px}
.pf{height:100%;border-radius:2px;background:var(--p);transition:width .3s}
.pf.ov{background:var(--r)}
.pf.hi{background:var(--o)}

/* ── Transaction list ── */
.dg{font-size:11px;font-weight:700;color:var(--muted);padding:8px 0 3px;text-transform:uppercase;letter-spacing:.6px}
.ti{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:11px;cursor:pointer}
.ti:last-child{border-bottom:none}
.tic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tic.expense{background:var(--rl)}
.tic.income{background:var(--gl)}
.tic.transfer{background:var(--ol)}
.tic.internal{background:var(--gl2)}
.tb{flex:1;min-width:0}
.tc{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{font-weight:700;font-size:15px;flex-shrink:0}
.ta.expense{color:var(--r)}
.ta.income{color:var(--g)}
.ta.transfer{color:var(--o)}
.ta.internal{color:var(--gray)}

/* pills */
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600;margin-left:4px}
.pill.sp{background:var(--pl);color:var(--p)}
.pill.db{background:var(--ol);color:var(--o)}

/* account rows */
.accrow{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:8px}
.accrow:last-child{border-bottom:none}
.accrow .anm{flex:1;font-size:14px}
.accrow input{width:110px;border:1.5px solid var(--border);border-radius:6px;padding:5px 8px;font-size:14px;font-weight:600;text-align:right;outline:none}
.accrow input:focus{border-color:var(--p)}
.acc-mode{display:flex;gap:4px}
.acc-mode-btn{padding:4px 9px;border:1.5px solid var(--border);border-radius:14px;background:var(--card);font-size:11px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.acc-mode-btn.on{background:var(--p);border-color:var(--p);color:#fff}

/* debt */
.dp{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.dp:last-child{border-bottom:none}
.dp .dnm{font-weight:600;font-size:14px}
.dp .dsub{font-size:12px;color:var(--muted);margin-top:1px}
.dp .dam{font-weight:700;font-size:16px}
.dam.pos{color:var(--g)}
.dam.neg{color:var(--r)}

/* insights */
.insight-row{display:flex;align-items:flex-start;gap:10px;padding:9px 2px 9px 10px;border-bottom:1px solid var(--border);border-left:3px solid var(--border);font-size:13px;line-height:1.4}
.insight-row:last-child{border-bottom:none}
.insight-row.ins-good{border-left-color:var(--g)}
.insight-row.ins-warn{border-left-color:var(--o)}
.ins-ic{flex:none;font-size:16px}
.ins-tx{color:var(--text)}

/* charts: category breakdown (stacked bar) */
.cbar{display:flex;width:100%;height:28px;border-radius:8px;overflow:hidden;background:var(--gl2)}
.cbar-seg{height:100%}
.cbar-leg{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cbar-row{display:flex;align-items:center;gap:9px;font-size:13px}
.cbar-dot{width:10px;height:10px;border-radius:50%;flex:none}
.cbar-nm{flex:1;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar-pct{color:var(--muted);font-size:12px;flex:none;width:34px;text-align:right}
.cbar-amt{font-weight:700;flex:none;min-width:64px;text-align:right}
.chart-empty{text-align:center;color:var(--muted);font-size:13px;padding:20px}

/* charts: trend line (svg) */
.trend-legend{display:flex;gap:16px;margin-bottom:10px;font-size:12px;color:var(--muted)}
.trend-legend span{display:inline-flex;align-items:center;gap:5px}
.trend-legend i{width:14px;height:2px;border-radius:1px;display:inline-block}

/* history table */
.htbl{width:100%;border-collapse:collapse;font-size:12px}
.htbl th{background:var(--pl);color:var(--p);font-weight:700;padding:8px 6px;text-align:right;white-space:nowrap}
.htbl th:first-child{text-align:left;border-radius:6px 0 0 0}
.htbl th:last-child{border-radius:0 6px 0 0}
.htbl td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
.htbl td:first-child{text-align:left;font-size:12px;max-width:110px;white-space:normal}
.htbl tr.ttl td{font-weight:700;border-top:2px solid var(--border);border-bottom:none}

/* settings */
.ci{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.ci:last-child{border-bottom:none}
.cnm{flex:1;font-size:14px}
.ctype{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.ctype.expense{background:var(--rl);color:var(--r)}
.ctype.income{background:var(--gl);color:var(--g)}
.ctype.transfer{background:var(--ol);color:var(--o)}
.ctype.internal{background:var(--gl2);color:var(--gray)}
.xbtn{width:28px;height:28px;border-radius:6px;border:none;background:var(--rl);color:var(--r);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}

.fi{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.fi:last-child{border-bottom:none}
.fnm{flex:1;font-size:14px}
.fi input{width:88px;border:1.5px solid var(--border);border-radius:6px;padding:5px 8px;font-size:14px;text-align:right;outline:none}
.fi input:focus{border-color:var(--p)}

/* add form inline */
.afrm{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.afrm input,.afrm select{
  flex:1;min-width:100px;padding:9px 10px;border:1.5px solid var(--border);
  border-radius:8px;font-size:14px;outline:none;
}
.afrm input:focus,.afrm select:focus{border-color:var(--p)}
.afrm button{padding:9px 14px;border:none;border-radius:8px;background:var(--p);color:#fff;font-size:14px;font-weight:700;cursor:pointer}

/* ── Modal ── */
.mo{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:200;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
@media(min-width:600px){.mo{max-width:430px;left:50%;right:auto;transform:translateX(-50%);width:100%}}
.mo.on{opacity:1;pointer-events:all}
.ms{
  background:var(--card);border-radius:20px 20px 0 0;
  width:100%;max-height:92dvh;overflow-y:auto;
  padding:16px 16px 32px;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.mo.on .ms{transform:translateY(0)}
.mh{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.mt{font-size:18px;font-weight:800;text-align:center;margin-bottom:18px}

/* ── Toast ── */
.toast{
  position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,12px);max-width:360px;width:calc(100% - 32px);
  background:var(--pd);color:#fff;font-size:13px;font-weight:600;text-align:center;
  padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);
  z-index:300;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── FAQ accordion ── */
.faq-item{border:1.5px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.faq-item summary{
  padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:8px;color:var(--text);
}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::before{content:'+';color:var(--p);font-weight:800;font-size:16px;flex-shrink:0;width:16px;text-align:center}
.faq-item[open] summary::before{content:'−'}
.faq-item[open] summary{border-bottom:1.5px solid var(--border)}
.faq-a{padding:10px 14px 14px 38px;font-size:13px;color:var(--muted);line-height:1.55}

/* ── Form ── */
.fg{margin-bottom:14px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fc2{
  width:100%;padding:11px 13px;border:2px solid var(--border);border-radius:10px;
  font-size:15px;color:var(--text);background:var(--inp);outline:none;transition:border-color .15s;
  -webkit-appearance:none;appearance:none;
}
.fc2:focus{border-color:var(--p)}
.fc2.req{border-left-color:var(--p)}
.fc2.err{border-color:var(--r)!important}

.tg{display:flex;background:var(--gl2);border-radius:8px;padding:2px;gap:2px}
.tb2{
  flex:1;padding:8px;border:none;background:none;border-radius:6px;
  font-size:13px;cursor:pointer;color:var(--muted);transition:all .15s;font-family:inherit;
}
.tb2.on{background:#fff;color:var(--p);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ── Buttons ── */
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;text-align:center;font-family:inherit}
.btn:active{opacity:.8}
.btn-p{background:var(--p);color:#fff}
.btn-r{background:var(--rl);color:var(--r)}
.btn-g{background:var(--gl2);color:var(--text)}
.gap8{height:8px}

/* ── Empty ── */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ei{font-size:44px;margin-bottom:12px}
.empty p{font-size:14px;line-height:1.5}

/* ── Onboarding ── */
.ob-overlay{
  position:fixed;inset:0;background:#fff;
  z-index:500;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .3s;
  overflow-y:auto;
}
@media(min-width:600px){.ob-overlay{max-width:430px;left:50%;right:auto;transform:translateX(-50%);width:100%}}
.ob-overlay.on{opacity:1;pointer-events:all}
.ob-sheet{
  flex:1;display:flex;flex-direction:column;
  padding:40px 28px 32px;min-height:100dvh;
}
.ob-top{flex:1;display:flex;flex-direction:column;justify-content:center}
.ob-icon{font-size:64px;margin-bottom:20px;text-align:center}
.ob-title{font-size:24px;font-weight:800;margin-bottom:14px;color:var(--text);text-align:center;line-height:1.2}
.ob-body{font-size:15px;line-height:1.75;color:#374151}
.ob-body b{color:var(--p)}
.ob-step{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.ob-badge{
  background:var(--pl);color:var(--p);
  border-radius:8px;padding:3px 9px;
  font-size:12px;font-weight:700;flex-shrink:0;margin-top:2px;white-space:nowrap;
}
.ob-dots{display:flex;justify-content:center;gap:7px;margin:28px 0 18px}
.ob-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .25s}
.ob-dot.on{background:var(--p);width:24px;border-radius:4px}
.ob-nav{display:flex;gap:10px}
.ob-nav button{flex:1;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.ob-back{background:var(--gl2);color:var(--text)}
.ob-next{background:var(--p);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.35)}

/* ── CSV import table ── */
.imp-row{padding:10px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.imp-row:last-child{border-bottom:none}
.imp-date{font-size:11px;color:var(--muted);margin-bottom:2px}
.imp-desc{font-size:13px;font-weight:500;margin-bottom:4px;word-break:break-word}
.imp-cat{width:100%;padding:5px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#fff;-webkit-appearance:none;appearance:none}
.imp-cat:focus{border-color:var(--p)}
.imp-cat.err{border-color:var(--r)}
.imp-amt{font-weight:700;font-size:15px;white-space:nowrap;padding-top:2px}
.imp-amt.inc{color:var(--g)}
.imp-amt.exp{color:var(--r)}
.imp-skip{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:4px;cursor:pointer}
.imp-skip input{cursor:pointer}
.imp-summary{background:var(--pl);border-radius:10px;padding:12px;margin-bottom:14px;font-size:14px;line-height:1.7}
.imp-upload-area{
  border:2.5px dashed var(--border);border-radius:14px;padding:32px 20px;
  text-align:center;cursor:pointer;color:var(--muted);transition:border-color .2s;
  margin-bottom:12px;
}
.imp-upload-area:hover{border-color:var(--p);color:var(--p)}

/* drag-to-reorder categories */
.ci-drag{cursor:grab;color:var(--muted);font-size:18px;padding:0 6px;user-select:none;touch-action:none;line-height:1}
.ci.dragging{opacity:.35;background:var(--pl)}
.ci.drag-over{border-top:2px solid var(--p)}

/* journal filters */
.jflt{display:flex;gap:6px;padding:4px 0 10px;flex-wrap:wrap}
.jftb{padding:6px 13px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-size:12px;cursor:pointer;color:var(--text);font-weight:500;transition:all .15s;white-space:nowrap}
.jftb.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:700}

/* debt contact chips */
.dchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.dchip{padding:4px 12px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-size:12px;cursor:pointer;transition:border-color .15s;white-space:nowrap}
.dchip:active{border-color:var(--p);background:var(--pl)}

/* split segment */
.split-seg{display:flex;background:var(--gl2);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.split-seg button{flex:1;min-width:44px;padding:7px 4px;border:none;background:none;border-radius:6px;font-size:13px;cursor:pointer;color:var(--muted);transition:all .15s;font-family:inherit}
.split-seg button.on{background:#fff;color:var(--p);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <button onclick="openHelp()" style="background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer;flex-shrink:0">?</button>
    <h1 id="hdr-t" style="flex:1;text-align:center">💜 Мой Бюджет</h1>
    <button id="hdr-btn" onclick="openModal()">+ Запись</button>
  </header>
  <main id="content"></main>
  <nav id="nav">
    <button class="ntab on" onclick="go('j')" id="nt-j"><span class="ic">📝</span>Журнал</button>
    <button class="ntab"    onclick="go('b')" id="nt-b"><span class="ic">📊</span>Бюджет</button>
    <button class="ntab"    onclick="go('d')" id="nt-d"><span class="ic">💰</span>Долги</button>
    <button class="ntab"    onclick="go('h')" id="nt-h"><span class="ic">📅</span>История</button>
    <button class="ntab"    onclick="go('s')" id="nt-s"><span class="ic">⚙️</span>Настройки</button>
  </nav>
</div>

<div class="toast" id="toast"></div>

  <div class="ms">

      <div id="ob-title" class="ob-title"></div>

    <div class="ob-dots" id="ob-dots"></div>

      <button class="ob-back" id="ob-back" onclick="obPrev(event)">← Назад</button>
      <button class="ob-next" id="ob-next" onclick="obNext(event)">Далее →</button>

</div>

<!-- Import CSV Modal -->
<div class="mo" id="mo-import">
  <div class="ms">
    <div class="mh"></div>
    <div class="mt">📥 Импорт выписки</div>
    <div id="mo-import-body"></div>
  </div>
</div>

<!-- Month Recap Card Modal -->
<div class="mo" id="mo-card">
  <div class="ms">
    <div class="mh"></div>
    <div class="mt">🎁 Карточка месяца</div>
    <div id="mo-card-body"></div>
  </div>
</div>

<div class="mo" id="mo-feedback">
  <div class="ms">
    <div class="mh"></div>
    <div class="mt">💬 Обратная связь</div>

    <div class="gap8"></div>
    <button class="btn btn-g" onclick="closeModal('mo-del')">Отмена</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════
const LS = {
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))}
};
const K = {TX:'mb2_tx',SET:'mb2_set',ACC:'mb2_acc',PLN:'mb2_pln',DN:'mb2_dn',TH:'mb2_th'};

// ═══════════════════════════════════════════
//  DEFAULT DATA
// ═══════════════════════════════════════════
const DEF_CATS = [
  {n:'Продукты',t:'expense'},{n:'Кафе',t:'expense'},
  {n:'Такси',t:'expense'},{n:'Доставка еды',t:'expense'},
  {n:'Одежда',t:'expense'},{n:'Аптека',t:'expense'},
  {n:'Дом и жизнь',t:'expense'},{n:'Подписки',t:'expense'},
  {n:'Интернет / связь',t:'expense'},{n:'Прочее',t:'expense'},
  {n:'Перевод (исходящий)',t:'transfer'},{n:'Внутренний',t:'internal'},
  {n:'❓ Уточнить',t:'expense'},
  {n:'Зарплата',t:'income'},{n:'Кэшбэк',t:'income'},
  {n:'Перевод (входящий)',t:'income'},
];
const DEF_FIX = [
  // Добавь свои обязательные платежи в разделе «Настройки»
];
// у новых пользователей карт нет — первая появится сама при первом импорте выписки
const DEF_ACC = [];

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let tab = 'j';
let bm = new Date().getMonth()+1, by = new Date().getFullYear();
let editId = null;
let editOrigCat = null, editOrigDesc = '';

let txs   = LS.get(K.TX,  []);
let cfg   = LS.get(K.SET, {cats:DEF_CATS, fix:DEF_FIX});
let accs  = LS.get(K.ACC, DEF_ACC);
let plns  = LS.get(K.PLN, {});
let dNames= LS.get(K.DN,  []); // known debt-person names
let theme = LS.get(K.TH, {c:'', dark:false});

if(!cfg.cats) cfg.cats = DEF_CATS;
if(!cfg.fix)  cfg.fix  = DEF_FIX;

// Инициализируем имена должников из уже существующих транзакций (одноразово)
if(!dNames.length){
  const existing=[...new Set(txs.filter(t=>t.debtPerson).map(t=>t.debtPerson))];
  if(existing.length){dNames=existing;LS.set(K.DN,dNames);}
}

// Гендерно-нейтральные подписи для типов долга. Значения tx.debtType — как раньше
// ('Дала в долг' и т.п.), чтобы не сломать уже сохранённые у пользователей записи;
// эти подписи — только то, что видно на экране.
const DEBT_LABELS = {
  'Дала в долг':'Дал(а) в долг',
  'Взяла в долг':'Взял(а) в долг',
  'Возврат получила':'Возврат получил(а)',
  'Я вернула':'Я вернул(а)',
};
const DEBT_BADGE = {
  'Дала в долг':'Дал(а)',
  'Взяла в долг':'Взял(а)',
  'Возврат получила':'Возврат',
  'Я вернула':'Вернул(а)',
};
function debtLabel(d){ return DEBT_LABELS[d]||d; }

// form toggles
let fSplit = false, fInclude = true, fTxType = null;
// fSplit: false=нет, 2=÷2, 3=÷3, 4=÷4, 'c'=своя сумма
let fSplitAmt = 0;

// journal filter
let jFilter = {type:'all', cat:'', period:'all', from:'', to:''};
// выбранная карта/счёт для просмотра (общий для Журнала и Бюджета) — '' = все карты
let accFilter = '';
function setAccFilter(a){ accFilter=a; render(); }

// ═══════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════
const uid  = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const fmt  = n=>isNaN(n)||n===null||n===undefined?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n)+' ₽';
const today= ()=>new Date().toISOString().slice(0,10);
const fmtD = s=>{if(!s)return'';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})};

function catType(name){
  const c=cfg.cats.find(c=>c.n===name);
  return c?c.t:'expense';
}
const EMOJI={expense:'💸',income:'💚',transfer:'🔄',internal:'🔁'};
const TNAME={expense:'Расход',income:'Доход',transfer:'Перевод',internal:'Внутренний'};
const TNAMESHORT={expense:'Расход',income:'Доход',transfer:'Перевод',internal:'Внутр.'};

function share(tx){
  const s=tx.split;
  if(!s) return tx.amount;            // false / undefined / 0
  if(s===true) return Math.ceil(tx.amount/2); // старый формат boolean
  if(s==='c')  return tx.splitAmt||tx.amount; // своя сумма
  return Math.ceil(tx.amount/Number(s));      // 2, 3, 4
}
// effectType учитывает ручной override txType (для возвратов)
function effectType(tx){return tx.txType||catType(tx.category)}
function toCount(tx){
  if(tx.include===false)return 0;
  if(effectType(tx)==='internal')return 0;
  return share(tx);
}

// Текущий остаток по карте = начальный остаток (введённый вручную, на момент
// до первой операции по этой карте в приложении) + всё, что прошло по операциям
// с этой картой с тех пор. Без стартового остатка можно увидеть только оборот
// за период выписки, а не реальный баланс — это и есть разница между «сколько
// потрачено» и «сколько сейчас на карте».
function accBalanceEffect(tx){
  if(tx.include===false) return 0;
  const t=effectType(tx);
  if(t==='income') return share(tx);
  if(t==='expense'||t==='transfer') return -share(tx);
  return 0; // internal — не считаем ни туда, ни сюда
}
function accActivity(accName){
  return txs.filter(t=>t.account===accName).reduce((s,t)=>s+accBalanceEffect(t),0);
}
function accBalance(accName){
  const opening=accs.find(a=>a.n===accName)?.b||0;
  return opening+accActivity(accName);
}

function byMonth(list,m,y){
  return list.filter(tx=>{
    const d=new Date(tx.date+'T00:00:00');
    return(d.getMonth()+1)===m && d.getFullYear()===y;
  });
}

function getMonths(){
  const s=new Set();
  txs.forEach(tx=>{const d=new Date(tx.date+'T00:00:00');s.add(`${d.getFullYear()}-${d.getMonth()+1}`)});
  const now=new Date(); s.add(`${now.getFullYear()}-${now.getMonth()+1}`);
  return Array.from(s).map(k=>{const[y,m]=k.split('-').map(Number);return{m,y}})
    .sort((a,b)=>(b.y*12+b.m)-(a.y*12+a.m));
}

function mName(m,y,short=false){
  return new Date(y,m-1,1).toLocaleDateString('ru-RU',short?{month:'short'}:{month:'long',year:'numeric'});
}

function plnKey(m,y){return `${y}-${m}`}
function getPln(m,y){return plns[plnKey(m,y)]||{}}
function setPln(m,y,cat,val){
  const k=plnKey(m,y);
  if(!plns[k])plns[k]={};
  plns[k][cat]=val;
  LS.set(K.PLN,plns);
}

function fixedTotal(){return cfg.fix.reduce((s,f)=>s+(Number(f.a)||0),0)}

// Чипы выбора карты/счёта — показываем только если операции реально
// пришли с 2+ разных карт (иначе фильтр просто нечего фильтровать)
function rAccChips(){
  const used=[...new Set(txs.map(t=>t.account).filter(Boolean))].sort();
  if(used.length<2) return '';
  const chip=(val,lbl)=>`<div class="mchip ${accFilter===val?'on':''}" onclick="setAccFilter('${val.replace(/'/g,"\\'")}')">${lbl}</div>`;
  return `<div class="mchips">${chip('','Все карты')}${used.map(a=>chip(a,'💳 '+a)).join('')}</div>`;
}

function monthStats(m,y){
  let list=byMonth(txs,m,y);
  if(accFilter) list=list.filter(tx=>tx.account===accFilter);
  let inc=0,exp=0;
  const cat={};
  list.forEach(tx=>{
    if(tx.include===false)return;
    const t=effectType(tx);
    const sh=share(tx);
    if(t==='income')inc+=sh;
    else if(t==='expense')exp+=sh;
    if(!cat[tx.category])cat[tx.category]=0;
    cat[tx.category]+=sh;
  });
  return{inc,exp,cat};
}

// «Свободно» не должно обнуляться в начале каждого месяца — если в прошлом
// месяце что-то осталось (или ушло в минус), это реальные деньги на руках
// сейчас, а не сгоревший остаток. Поэтому считаем нарастающим итогом:
// сумма (доходы − расходы) по всем месяцам вплоть до выбранного включительно.
function cumulativeFree(m,y){
  const target=y*12+m;
  let total=0;
  getMonths().forEach(({m:mm,y:yy})=>{
    if(yy*12+mm<=target){
      const s=monthStats(mm,yy);
      total+=s.inc-s.exp;
    }
  });
  return total;
}

// ═══════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════
const HDR_TITLES={j:'📝 Журнал',b:'📊 Бюджет',d:'💰 Долги',h:'📅 История',s:'⚙️ Настройки'};
function go(t){
  tab=t;
  document.querySelectorAll('.ntab').forEach(el=>el.classList.remove('on'));
  document.getElementById('nt-'+t)?.classList.add('on');
  document.getElementById('hdr-t').textContent=HDR_TITLES[t];
  render();
  document.getElementById('content').scrollTop=0;
}

// ═══════════════════════════════════════════
//  RENDER DISPATCHER
// ═══════════════════════════════════════════
function render(){
  const el=document.getElementById('content');
  if(tab==='j') el.innerHTML=rJournal();
  else if(tab==='b'){el.innerHTML=rBudget(); attachBudget();}
  else if(tab==='d') el.innerHTML=rDebts();
  else if(tab==='h') el.innerHTML=rHistory();
  else if(tab==='s'){el.innerHTML=rSettings(); attachSettings();}
  // iOS Safari не уважает padding-bottom у overflow:auto → добавляем явный элемент
  const sp=document.createElement('div');
  sp.style.cssText='height:90px;flex-shrink:0;pointer-events:none';
  el.appendChild(sp);
}

// ═══════════════════════════════════════════
//  JOURNAL
// ═══════════════════════════════════════════
function setJF(type){jFilter.type=type;render()}
function setJFC(cat){jFilter.cat=cat;render()}
function setJFP(period){jFilter.period=period;render()}
function setJFMonth(m,y){bm=m;by=y;jFilter.period='month';render()}
function setJFD(field,val){jFilter[field]=val;render()}

function jDateRange(){
  const t=today();
  const wk=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  if(jFilter.period==='today') return{from:t,to:t};
  if(jFilter.period==='week')  return{from:wk,to:t};
  if(jFilter.period==='month'){
    // тот же месяц, что выбран в разделе «Бюджет» (bm/by), а не текущий календарный
    const from=new Date(by,bm-1,1).toISOString().slice(0,10);
    const to=new Date(by,bm,0).toISOString().slice(0,10);
    return{from,to};
  }
  if(jFilter.period==='custom')return{from:jFilter.from,to:jFilter.to};
  return{from:'',to:''};
}

function rJournal(){
  if(!txs.length)return`<div class="empty"><div class="ei">📝</div><p>Пока нет записей.<br>Нажми <b>+ Запись</b> чтобы начать.</p></div>`;

  // ── Фильтр-бар: тип + категория
  const allCats=[...new Set(txs.map(t=>t.category))].sort();
  const catOpts=allCats.map(c=>`<option value="${c}"${c===jFilter.cat?' selected':''}>${c}</option>`).join('');
  const inpStyle=`padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:var(--inp);color:var(--text);flex:1`;
  const customDates=jFilter.period==='custom'?`
    <div style="display:flex;gap:6px;width:100%;margin-top:6px;align-items:center">
      <input type="date" value="${jFilter.from}" onchange="setJFD('from',this.value)" style="${inpStyle}">
      <span style="color:var(--muted);flex-shrink:0">—</span>
      <input type="date" value="${jFilter.to}" onchange="setJFD('to',this.value)" style="${inpStyle}">
    </div>`:'';
  const fBar=`<div style="margin-bottom:6px">
    <div class="jflt">
      <button class="jftb ${jFilter.type==='all'?'on':''}" onclick="setJF('all')">Все</button>
      <button class="jftb ${jFilter.type==='income'?'on':''}" onclick="setJF('income')">💚 Доход</button>
      <button class="jftb ${jFilter.type==='expense'?'on':''}" onclick="setJF('expense')">💸 Расход</button>
      <select onchange="setJFC(this.value)" style="padding:6px 10px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;outline:none;background:var(--inp);color:var(--text);-webkit-appearance:none;flex:1;min-width:0">
        <option value="">Все категории</option>${catOpts}
      </select>
    </div>
    <div class="jflt" style="margin-top:4px">
      <button class="jftb ${jFilter.period==='all'?'on':''}" onclick="setJFP('all')">Всё время</button>
      <button class="jftb ${jFilter.period==='today'?'on':''}" onclick="setJFP('today')">Сегодня</button>
      <button class="jftb ${jFilter.period==='week'?'on':''}" onclick="setJFP('week')">7 дней</button>
      <button class="jftb ${jFilter.period==='custom'?'on':''}" onclick="setJFP('custom')">📅 Период</button>
    </div>
    ${customDates}
    <div class="mchips" style="margin-top:2px">${getMonths().slice(0,12).map(({m,y})=>
      `<div class="mchip ${jFilter.period==='month'&&m===bm&&y===by?'on':''}" onclick="setJFMonth(${m},${y})">${mName(m,y,true).replace('.','')}</div>`
    ).join('')}</div>
  </div>${rAccChips()}`;

  // ── Фильтрация
  let filtered=[...txs];
  if(jFilter.type!=='all') filtered=filtered.filter(tx=>effectType(tx)===jFilter.type);
  if(jFilter.cat) filtered=filtered.filter(tx=>tx.category===jFilter.cat);
  if(accFilter) filtered=filtered.filter(tx=>tx.account===accFilter);
  const dr=jDateRange();
  if(dr.from) filtered=filtered.filter(tx=>tx.date>=dr.from);
  if(dr.to)   filtered=filtered.filter(tx=>tx.date<=dr.to);

  if(!filtered.length) return fBar+`<div class="empty"><div class="ei">🔍</div><p>Нет записей по выбранным фильтрам</p></div>`;

  const sorted=filtered.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const groups={};
  sorted.forEach(tx=>{
    if(!groups[tx.date])groups[tx.date]=[];
    groups[tx.date].push(tx);
  });
  const tody=today();
  const yest=new Date(Date.now()-864e5).toISOString().slice(0,10);
  let h=fBar;
  Object.entries(groups).forEach(([date,list])=>{
    const d=new Date(date+'T00:00:00');
    let lbl=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
    if(date===tody)lbl='Сегодня · '+lbl;
    else if(date===yest)lbl='Вчера · '+lbl;
    h+=`<div class="dg">${lbl}</div><div class="card" style="padding:4px 14px">`;
    list.forEach(tx=>{
      const t=effectType(tx);
      const sh=share(tx);
      const sgn=t==='income'?'+':'−';
      const s=tx.split;
      const splitBadge=s?(s===true||s===2?'<span class="pill sp">÷2</span>':`<span class="pill sp">÷${s==='c'?'своя':s}</span>`):'';
      const badges=splitBadge+(tx.debtType?`<span class="pill db">${DEBT_BADGE[tx.debtType]||tx.debtType.slice(0,6)}</span>`:'');
      const desc=[tx.description,tx.comment].filter(Boolean).join(' · ');
      h+=`<div class="ti" onclick="openModal('${tx.id}')">
        <div class="tic ${t}">${EMOJI[t]}</div>
        <div class="tb">
          <div class="tc">${tx.category}${badges}</div>
          <div class="tm">${desc||fmtD(tx.date)}</div>
        </div>
        <div class="ta ${t}">${sgn}${fmt(sh)}</div>
      </div>`;
    });
    h+='</div>';
  });
  return h;
}

// ═══════════════════════════════════════════
//  BUDGET
// ═══════════════════════════════════════════
function rBudget(){
  const m=bm,y=by;
  const st=monthStats(m,y);
  const pln=getPln(m,y);
  const ft=fixedTotal();
  // Обязательные расходы учитываются через журнал, без дублирования.
  // «Свободно» — нарастающим итогом с учётом остатка прошлых месяцев (см. cumulativeFree)
  const free=cumulativeFree(m,y);
  // «❓ Уточнить» — служебная категория-заглушка для неопознанных операций из импорта,
  // планировать бюджет по ней бессмысленно, поэтому в списке трат её не показываем
  const expCats=cfg.cats.filter(c=>c.t==='expense'&&c.n!=='❓ Уточнить');

  const months=getMonths();
  const chips=months.slice(0,6).map(({m:mm,y:yy})=>{
    const on=(mm===m&&yy===y)?'on':'';
    return`<div class="mchip ${on}" onclick="selMonth(${mm},${yy})">${mName(mm,yy,true).replace('.','')}</div>`;
  }).join('');

  // income plan total
  const incKeys=['Зарплата','Перевод (входящий)','Кэшбэк'];
  const plnInc=incKeys.reduce((s,k)=>s+(pln[k]||0),0);

  let h=`<div class="mchips">${chips}</div>
  ${rAccChips()}
  <div class="sg">
    <div class="sc"><div class="lbl">💚 Доходы (факт)</div><div class="val inc">${fmt(st.inc)}</div></div>
    <div class="sc"><div class="lbl">💸 Расходы</div><div class="val exp">${fmt(st.exp)}</div></div>
    <div class="sc" style="grid-column:1/-1">
      <div class="lbl">📊 Свободно</div><div class="val free" style="font-size:26px">${fmt(free)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">с учётом остатка прошлых месяцев</div>
    </div>
  </div>
  <button class="btn btn-p" style="margin-top:10px" onclick="openMonthCard()">🎁 Карточка месяца</button>`;

  // ── Доходы
  h+=`<div class="card"><div class="card-hd">💚 Доходы</div>
  <div class="bcols"><div class="nm"></div><div class="pl" style="text-align:right">ПЛАН</div><div class="fc">ФАКТ</div></div>`;
  const incRows=[
    {k:'Зарплата',lbl:'Зарплата'},
    {k:'Перевод (входящий)',lbl:'Переводы'},
    {k:'Кэшбэк',lbl:'Кэшбэк / прочее'},
  ];
  incRows.forEach(({k,lbl})=>{
    const pv=pln[k]||0, fv=st.cat[k]||0;
    h+=`<div class="brow">
      <div class="nm">${lbl}</div>
      <div class="pl"><input type="number" class="pi plan-inp" data-cat="${k}" value="${pv||''}" placeholder="0" min="0" inputmode="decimal"></div>
      <div class="fc ok">${fv?fmt(fv):'—'}</div>
    </div>`;
  });
  h+=`<div class="brow ttl">
    <div class="nm">ИТОГО</div>
    <div class="pl" style="text-align:right;font-size:13px;font-weight:700">${fmt(plnInc)}</div>
    <div class="fc ok" style="font-size:15px">${fmt(st.inc)}</div>
  </div></div>`;

  // ── Обязательные
  const today_d=new Date().getDate();
  h+=`<div class="card"><div class="card-hd">🔒 Обязательные расходы</div>
  <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Запиши оплату в Журнале — она учтётся в итогах автоматически</div>`;
  cfg.fix.forEach((fe,fi)=>{
    const overdue=fe.due && !fe.paid && today_d>=fe.due;
    const dueBadge=fe.due?`<span style="font-size:11px;color:${overdue?'var(--r)':'var(--muted)'};margin-right:4px">${overdue?'⚠️':'🗓'} ${fe.due} число</span>`:'';
    const paidBadge=fe.paid?`<span style="font-size:11px;color:var(--g);margin-right:4px">✅</span>`:'';
    h+=`<div class="brow" style="${overdue?'background:var(--rl);border-radius:8px;padding-left:8px':''}">
      <div class="nm">${paidBadge}${fe.n}${dueBadge}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="fc ov">${fmt(fe.a)}</div>
        <button onclick="toggleFixPaid(${fi})" style="border:none;background:none;cursor:pointer;font-size:16px;padding:2px" title="${fe.paid?'Отметить неоплаченным':'Отметить оплаченным'}">${fe.paid?'✅':'⬜'}</button>
      </div>
    </div>`;
  });
  h+=`<div class="brow ttl">
    <div class="nm">ИТОГО</div>
    <div class="fc ov" style="margin-left:auto;font-size:15px">${fmt(ft)}</div>
  </div></div>`;

  // ── Переменные
  const totalVarPln=expCats.reduce((s,c)=>s+(pln[c.n]||0),0);
  const totalVarFct=expCats.reduce((s,c)=>s+(st.cat[c.n]||0),0);
  h+=`<div class="card"><div class="card-hd">💸 Переменные расходы</div>
  <div class="bcols"><div class="nm"></div><div class="pl" style="text-align:right">ПЛАН</div><div class="fc">ФАКТ</div></div>`;
  expCats.forEach(cat=>{
    const pv=pln[cat.n]||0, fv=st.cat[cat.n]||0;
    const over=pv>0&&fv>pv, near=pv>0&&fv>pv*.8&&!over;
    const pct=pv>0?Math.min(fv/pv,1):0;
    const bar=pv>0?`<div class="pb"><div class="pf ${over?'ov':near?'hi':''}" style="width:${pct*100}%"></div></div>`:'';
    h+=`<div class="brow">
      <div class="nm">${cat.n}${bar}</div>
      <div class="pl"><input type="number" class="pi plan-inp" data-cat="${cat.n}" value="${pv||''}" placeholder="0" min="0" inputmode="decimal"></div>
      <div class="fc ${over?'ov':''}">${fv?fmt(fv):'—'}</div>
    </div>`;
  });
  h+=`<div class="brow ttl">
    <div class="nm">ИТОГО</div>
    <div class="pl" style="text-align:right;font-size:13px;font-weight:700">${fmt(totalVarPln)}</div>
    <div class="fc ov" style="font-size:15px">${fmt(totalVarFct)}</div>
  </div></div>`;

  // ── Счета
  h+=`<div class="card"><div class="card-hd">🏦 Мои счета</div>`;
  accs.forEach((acc,i)=>{
    const linked=txs.some(t=>t.account===acc.n);
    if(linked){
      const mode=acc.balMode||'open';
      const activity=accActivity(acc.n);
      const displayVal=mode==='open'?(acc.b||0):(acc.b||0)+activity;
      h+=`<div class="accrow" style="flex-wrap:wrap">
        <div class="anm">${acc.n}</div>
        <div class="acc-mode">
          <button type="button" class="acc-mode-btn ${mode==='open'?'on':''}" onclick="setAccMode(${i},'open')">начальный</button>
          <button type="button" class="acc-mode-btn ${mode==='close'?'on':''}" onclick="setAccMode(${i},'close')">текущий</button>
        </div>
        <input type="number" class="acc-inp" data-i="${i}" data-mode="${mode}" value="${displayVal||''}" placeholder="0" inputmode="decimal"
          title="${mode==='open'?'Остаток на момент до первой операции по этой карте в приложении':'Остаток на карте прямо сейчас'}">
        <div style="flex-basis:100%;text-align:right;font-size:12px;color:var(--muted);margin-top:2px">
          сейчас на карте: <b style="color:var(--text)">${fmt(accBalance(acc.n))}</b>
        </div>
      </div>`;
    } else {
      h+=`<div class="accrow">
        <div class="anm">${acc.n}</div>
        <input type="number" class="acc-inp" data-i="${i}" value="${acc.b||''}" placeholder="0" inputmode="decimal" title="Обновляй вручную — по этой карте нет импортированных операций">
      </div>`;
    }
  });
  h+=`<div style="font-size:11px;color:var(--muted);padding-top:4px">
    Для карт с операциями выбери «начальный» — если вносишь остаток на момент ДО первой загруженной
    операции, или «текущий» — если у тебя уже загружена свежая выписка и известно, сколько на карте прямо сейчас.
    Остальные счета обновляй вручную.
  </div>`;
  h+='</div>';
  return h;
}

function setAccMode(i,mode){ accs[i].balMode=mode; LS.set(K.ACC,accs); render(); }

function attachBudget(){
  document.querySelectorAll('.plan-inp').forEach(inp=>{
    inp.addEventListener('change',()=>setPln(bm,by,inp.dataset.cat,Number(inp.value)||0));
  });
  document.querySelectorAll('.acc-inp').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const i=inp.dataset.i, mode=inp.dataset.mode||'open', val=Number(inp.value)||0;
      // «текущий» — пользователь вводит остаток на карте прямо сейчас, а не начальный;
      // пересчитываем его в начальный (val − вся активность по карте), чтобы дальше
      // и accBalance(), и повторные импорты продолжали работать по единой формуле
      accs[i].b = mode==='close' ? val-accActivity(accs[i].n) : val;
      LS.set(K.ACC,accs);
      render();
    });
  });
}

function selMonth(m,y){bm=m;by=y;render()}

// ═══════════════════════════════════════════
function rDebts(){
  const dtxs=txs.filter(tx=>tx.debtType);
  const bal={};
  dtxs.forEach(tx=>{
    const p=tx.debtPerson||'?';
    if(!bal[p])bal[p]={lent:0,back:0,borrow:0,iret:0};
    const a=tx.debtAmount||share(tx);
    if(tx.debtType==='Дала в долг')      bal[p].lent+=a;
    else if(tx.debtType==='Возврат получила') bal[p].back+=a;
    else if(tx.debtType==='Взяла в долг')    bal[p].borrow+=a;
    else if(tx.debtType==='Я вернула')       bal[p].iret+=a;
  });
  const oweMe=Object.entries(bal).map(([n,b])=>({n,v:b.lent-b.back})).filter(x=>x.v>0);
  const iOwe=Object.entries(bal).map(([n,b])=>({n,v:b.borrow-b.iret})).filter(x=>x.v>0);
  const totOme=oweMe.reduce((s,x)=>s+x.v,0);
  const totIowe=iOwe.reduce((s,x)=>s+x.v,0);

  let h=`<div class="sg">
    <div class="sc"><div class="lbl">👉 Мне должны</div><div class="val inc">${fmt(totOme)}</div></div>
    <div class="sc"><div class="lbl">👈 Я в долгу</div><div class="val exp">${fmt(totIowe)}</div></div>
  </div>`;

  h+=`<div class="card"><div class="card-hd">👉 Мне должны</div>`;
  if(!oweMe.length)h+=`<div style="text-align:center;color:var(--muted);padding:16px;font-size:14px">Никто ничего не должен 🎉</div>`;
  else oweMe.forEach(p=>{
    h+=`<div class="dp"><div><div class="dnm">${p.n}</div><div class="dsub">задолженность</div></div><div class="dam pos">${fmt(p.v)}</div></div>`;
  });
  h+='</div>';

  h+=`<div class="card"><div class="card-hd">👈 Я в долгу</div>`;
  if(!iOwe.length)h+=`<div style="text-align:center;color:var(--muted);padding:16px;font-size:14px">Нет задолженностей ✅</div>`;
  else iOwe.forEach(p=>{
    h+=`<div class="dp"><div><div class="dnm">${p.n}</div><div class="dsub">мой долг</div></div><div class="dam neg">−${fmt(p.v)}</div></div>`;
  });
  h+='</div>';

  if(dtxs.length){
    const sd=[...dtxs].sort((a,b)=>new Date(b.date)-new Date(a.date));
    h+=`<div class="card"><div class="card-hd">📜 Все долговые операции</div>`;
    sd.forEach(tx=>{
      const pos=tx.debtType==='Дала в долг'||tx.debtType==='Возврат получила';
      const a=tx.debtAmount||share(tx);
      h+=`<div class="ti">
        <div class="tic ${pos?'income':'expense'}">${pos?'💚':'💸'}</div>
        <div class="tb">
          <div class="tc">${debtLabel(tx.debtType)} — ${tx.debtPerson||'?'}</div>
          <div class="tm">${tx.category} · ${fmtD(tx.date)}</div>
        </div>
        <div class="ta ${pos?'income':'expense'}">${fmt(a)}</div>
      </div>`;
    });
    h+='</div>';
  }
  return h;
}

// ═══════════════════════════════════════════
//  CHARTS (категории месяца + тренд по месяцам)
// ═══════════════════════════════════════════
const CHART_HUES=['c1','c2','c3','c4','c5','c6','c7','c8'];

// Разбивка расходов месяца по категориям: одна горизонтальная stacked-полоса
// + легенда с суммой и долей. Больше 8 категорий — хвост сворачиваем в «Прочее».
function rCategoryBar(m,y){
  const st=monthStats(m,y);
  const expNames=new Set(cfg.cats.filter(c=>c.t==='expense').map(c=>c.n));
  let items=Object.entries(st.cat)
    .filter(([n,v])=>expNames.has(n)&&v>0)
    .sort((a,b)=>b[1]-a[1]);

  if(!items.length) return `<div class="chart-empty">Нет расходов за этот месяц</div>`;

  let shown=items, rest=0;
  if(items.length>8){
    shown=items.slice(0,7);
    rest=items.slice(7).reduce((s,[,v])=>s+v,0);
  }
  const total=items.reduce((s,[,v])=>s+v,0);

  const segs=shown.map(([n,v],i)=>({n,v,color:`var(--${CHART_HUES[i]})`}));
  // если среди топ-7 уже есть категория «Прочее» — сборную группу остатка
  // называем иначе, чтобы в легенде не было двух одинаковых подписей
  if(rest>0) segs.push({n:shown.some(([n])=>n==='Прочее')?'Остальное':'Прочее',v:rest,color:'var(--gray)'});

  const bar=segs.map((s,i)=>
    `<div class="cbar-seg" style="flex:${s.v} 0 0;background:${s.color};${i<segs.length-1?'margin-right:2px':''}" title="${s.n}: ${fmt(s.v)}"></div>`
  ).join('');

  const legend=segs.map(s=>`
    <div class="cbar-row">
      <span class="cbar-dot" style="background:${s.color}"></span>
      <span class="cbar-nm">${s.n}</span>
      <span class="cbar-pct">${Math.round(s.v/total*100)}%</span>
      <span class="cbar-amt">${fmt(s.v)}</span>
    </div>`).join('');

  return `<div class="cbar">${bar}</div><div class="cbar-leg">${legend}</div>`;
}

// Тренд доходов/расходов по месяцам — обычный линейный график (SVG),
// цвета намеренно те же зелёный/красный, что и везде в приложении для дохода/расхода.
function rTrendChart(cols, stats){
  if(cols.length<2) return `<div class="chart-empty">Нужно больше месяцев с данными</div>`;
  // хронологический порядок: старые слева, свежие справа
  const ord=[...cols].map((c,i)=>({...c,st:stats[i]})).reverse();

  const W=320,H=150,padL=50,padR=10,padT=10,padB=22;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const maxV=Math.max(1,...ord.map(o=>Math.max(o.st.inc,o.st.exp)));
  const niceMax=Math.ceil(maxV/1000)*1000||maxV;

  const x=i=>padL+(ord.length===1?plotW/2:i/(ord.length-1)*plotW);
  const y=v=>padT+plotH-(v/niceMax*plotH);

  const path=key=>ord.map((o,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(o.st[key]).toFixed(1)}`).join(' ');

  const gridLines=[0,0.5,1].map(f=>{
    const yy=padT+plotH-(f*plotH);
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--chart-grid)" stroke-width="1"/>
      <text x="${padL-8}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--muted)">${fmt(Math.round(niceMax*f))}</text>`;
  }).join('');

  const xLabels=ord.map((o,i)=>
    `<text x="${x(i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)">${mName(o.m,o.y,true).replace('.','')}</text>`
  ).join('');

  const dots=key=>ord.map((o,i)=>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(o.st[key]).toFixed(1)}" r="4" fill="var(${key==='inc'?'--g':'--r'})" stroke="var(--card)" stroke-width="2"><title>${mName(o.m,o.y,true)}: ${fmt(o.st[key])}</title></circle>`
  ).join('');

  const lastInc=ord[ord.length-1].st.inc, lastExp=ord[ord.length-1].st.exp;
  const labelUp=lastInc>=lastExp;
  const lastX=x(ord.length-1).toFixed(1);
  const incLabelY=(y(lastInc)+(labelUp?-10:16)).toFixed(1);
  const expLabelY=(y(lastExp)+(labelUp?16:-10)).toFixed(1);
  // halo (обводка цветом фона карточки) — чтобы подпись оставалась читаемой
  // там, где линии пересекаются прямо под текстом
  const haloText=(x,yy,txt)=>`<text x="${x}" y="${yy}" text-anchor="end" font-size="10" font-weight="700"
      paint-order="stroke" stroke="var(--card)" stroke-width="3" fill="var(--text)">${txt}</text>`;
  // Когда доходы и расходы в последнем месяце близки друг к другу, линии сходятся
  // и подпись рядом с точкой почти неизбежно ляжет поверх соседней линии — в этом
  // случае подписи-значения лучше убрать и положиться на легенду + таблицу ниже
  // (там точные цифры уже есть), чем городить нечитаемую надпись поверх линии.
  const converging=Math.abs(lastInc-lastExp)<niceMax*0.15;
  const endLabels=converging?'':
    haloText(lastX,incLabelY,fmt(lastInc))+haloText(lastX,expLabelY,fmt(lastExp));

  return `
    <div class="trend-legend">
      <span><i style="background:var(--g)"></i>Доходы</span>
      <span><i style="background:var(--r)"></i>Расходы</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Тренд доходов и расходов по месяцам">
      ${gridLines}
      ${xLabels}
      <path d="${path('exp')}" fill="none" stroke="var(--r)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${path('inc')}" fill="none" stroke="var(--g)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots('exp')}
      ${dots('inc')}
      ${endLabels}
    </svg>`;
}

// ═══════════════════════════════════════════
//  ИНСАЙТЫ — автоматические наблюдения по цифрам, которые уже посчитаны
//  для History (без ML — просто сравнение месяцев между собой)
// ═══════════════════════════════════════════
// Человекочитаемое название операции: сырые банковские описания (номера СБП,
// «Телефон получателя», реквизиты счетов) не годятся для показа — в этих
// случаях берём название категории вместо технического текста
function txLabel(tx){
  const d=(tx.description||'').trim();
  const technical=/идентификатор операции|телефон получателя|сбп|со счета\s*:|на счет\s*:/i.test(d);
  return (!d||technical)?tx.category:d;
}
// Перевод между СВОИМИ ЖЕ счетами/вкладами внутри одного банка — не покупка,
// не должен попадать в «самую крупную трату» (разные банки описывают это по-разному:
// Сбербанк — "рублёвый перевод между счетами клиента", Т-Банк — "внутренний перевод
// на договор"/"внутрибанковский перевод с договора").
function isSelfTransferDesc(desc){
  return /рублевый перевод между счетами клиента|внутренний перевод на договор|внутрибанковский перевод (?:с|на) договор/i.test(desc||'');
}
function normDesc(desc){
  return (desc||'').trim().toLowerCase().replace(/\s+/g,' ');
}

function computeInsights(cols, stats){
  const insights=[];
  if(!cols.length) return insights;

  // 1) Самая крупная одиночная трата текущего месяца
  // (переводы между своими же счетами — это не покупка, исключаем их отдельно,
  // тем же паттерном, что уже используется при разборе банковских выписок)
  const curCol=cols[0];
  const monthTxs=byMonth(txs,curCol.m,curCol.y).filter(t=>
    t.include!==false&&effectType(t)==='expense'&&!isSelfTransferDesc(t.description)
  );
  if(monthTxs.length){
    const biggest=monthTxs.reduce((a,b)=>share(b)>share(a)?b:a);
    insights.push({icon:'💸',tone:'neutral',text:`Самая крупная трата месяца — «${txLabel(biggest)}» на ${fmt(share(biggest))}`});
  }

  // сравниваем только по расходным статьям — рост кэшбэка или зарплаты это
  // не «тревожный тренд», и не то, про что стоит писать в разделе про траты
  const expCatSet=new Set(cfg.cats.filter(c=>c.t==='expense').map(c=>c.n));

  if(stats.length>1){
    const cur=stats[0], prev=stats[1];

    // 2) Категория с самым заметным изменением к прошлому месяцу
    const catNames=new Set([...Object.keys(cur.cat),...Object.keys(prev.cat)].filter(c=>expCatSet.has(c)));
    let best=null;
    catNames.forEach(c=>{
      const a=cur.cat[c]||0, b=prev.cat[c]||0;
      if(b<=0) return; // новая статья — не «рост», отдельная история
      const diff=a-b, pct=diff/b*100;
      if(Math.abs(diff)<300||Math.abs(pct)<20) return; // отсекаем шум по мелким суммам
      if(!best||Math.abs(diff)>Math.abs(best.diff)) best={cat:c,diff,pct,base:b};
    });
    if(best){
      // при маленькой базе прошлого месяца % выглядит абсурдно (напр. +8000%
      // из-за разовой мелочи в прошлом месяце) — показываем его только когда
      // база достаточно большая, чтобы процент был осмысленным
      const pctTxt=best.base>=1000?` (${best.diff>0?'+':''}${Math.round(best.pct)}%)`:'';
      if(best.diff>0) insights.push({icon:'📈',tone:'warn',text:`«${best.cat}»: +${fmt(best.diff)} к прошлому месяцу${pctTxt}`});
      else insights.push({icon:'📉',tone:'good',text:`«${best.cat}»: −${fmt(Math.abs(best.diff))} к прошлому месяцу${pctTxt} — молодец!`});
    }

    // 3) Свободные деньги (доходы − расходы) относительно среднего по остальным месяцам
    const frees=stats.map(s=>s.inc-s.exp);
    const curFree=frees[0], others=frees.slice(1);
    if(others.length){
      const avgOther=others.reduce((s,v)=>s+v,0)/others.length;
      if(avgOther>0&&curFree>avgOther*1.15) insights.push({icon:'✅',tone:'good',text:`Свободных денег в этом месяце больше обычного: ${fmt(curFree)}`});
      else if(curFree<avgOther*0.7||(curFree<0&&avgOther>=0)) insights.push({icon:'⚠️',tone:'warn',text:`Свободных денег в этом месяце меньше обычного: ${fmt(curFree)}`});
    }
  }

  // 4) Категория, которая растёт 3+ месяца подряд (нужно минимум 3 месяца истории)
  if(stats.length>=3){
    const chrono=[...stats].reverse(); // от старых к новым
    const catNames=[...new Set(chrono.flatMap(s=>Object.keys(s.cat)))].filter(c=>expCatSet.has(c));
    let streakBest=null;
    catNames.forEach(c=>{
      const seq=chrono.map(s=>s.cat[c]||0);
      if(seq[seq.length-1]<300) return; // сейчас сумма слишком мала, чтобы про неё писать
      let streak=1;
      for(let i=seq.length-1;i>0;i--){
        if(seq[i]>seq[i-1]&&seq[i-1]>0) streak++; else break;
      }
      if(streak>=3&&(!streakBest||streak>streakBest.streak)) streakBest={cat:c,streak};
    });
    if(streakBest) insights.push({icon:'🔥',tone:'warn',text:`«${streakBest.cat}» растёт ${streakBest.streak}-й месяц подряд`});
  }

  return insights.slice(0,4);
}

function rInsights(cols, stats){
  const items=computeInsights(cols,stats);
  if(!items.length) return '';
  const rows=items.map(it=>`
    <div class="insight-row ins-${it.tone}">
      <span class="ins-ic">${it.icon}</span>
      <span class="ins-tx">${it.text}</span>
    </div>`).join('');
  return `<div class="card"><div class="card-hd">🔍 Наблюдения</div>${rows}</div>`;
}

// ═══════════════════════════════════════════
//  КАРТОЧКА МЕСЯЦА (шэринг, в духе Spotify Wrapped) — рисуем на canvas,
//  чтобы можно было сохранить как обычную картинку
// ═══════════════════════════════════════════
function monthCardData(){
  const m=bm,y=by;
  const st=monthStats(m,y);
  const months=getMonths();
  const idx=months.findIndex(mm=>mm.m===m&&mm.y===y);
  const others=months.filter((_,i)=>i!==idx).slice(0,5).map(({m:mm,y:yy})=>monthStats(mm,yy));
  const avgExp=others.length?others.reduce((s,o)=>s+o.exp,0)/others.length:null;

  const expCatSet=new Set(cfg.cats.filter(c=>c.t==='expense').map(c=>c.n));
  const cats=Object.entries(st.cat).filter(([n,v])=>expCatSet.has(n)&&v>0).sort((a,b)=>b[1]-a[1]);

  const monthTxs=byMonth(txs,m,y).filter(t=>
    t.include!==false&&effectType(t)==='expense'&&!isSelfTransferDesc(t.description)
  );
  const biggest=monthTxs.length?monthTxs.reduce((a,b)=>share(b)>share(a)?b:a):null;

  return {m,y,st,avgExp,cats,biggest};
}

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// Обрезаем текст многоточием, если он не влезает в maxWidth — иначе на canvas
// длинное описание операции просто вылезло бы за край картинки без предупреждения
function fitText(ctx,text,maxWidth){
  if(ctx.measureText(text).width<=maxWidth) return text;
  let t=text;
  while(t.length>1 && ctx.measureText(t+'…').width>maxWidth) t=t.slice(0,-1);
  return t+'…';
}

function drawMonthCard(canvas, data){
  const W=1080;
  const hasAvg=data.avgExp!==null&&data.avgExp>0;
  const top=data.cats.slice(0,4);
  // Высоту считаем заранее по составу контента (сравнение/категории/крупная
  // трата есть не всегда) — иначе при фиксированной высоте либо обрежет
  // контент, либо снизу останется пустой холст.
  let H=460;
  H+=hasAvg?140:30;
  H+=36+top.length*96+40;
  H+=220; // доходы/остаток
  if(data.biggest) H+=170;
  H+=140; // подвал
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const cs=getComputedStyle(document.documentElement);
  const p=cs.getPropertyValue('--p').trim()||'#7c3aed';
  const pd=cs.getPropertyValue('--pd').trim()||'#5b21b6';
  const F='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

  // фон — вертикальный градиент акцентным цветом текущей темы
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,p);
  grad.addColorStop(1,pd);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.font=`600 30px ${F}`;
  ctx.fillText('МОЙ БЮДЖЕТ', 72, 110);

  ctx.fillStyle='#fff';
  ctx.font=`800 64px ${F}`;
  ctx.fillText(mName(data.m,data.y).toUpperCase(), 72, 190);

  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.font=`500 34px ${F}`;
  ctx.fillText('Ты потратила в этом месяце', 72, 300);

  ctx.fillStyle='#fff';
  ctx.font=`800 128px ${F}`;
  ctx.fillText(fmt(data.st.exp), 72, 440);

  // сравнение со средним по остальным месяцам
  let cy=500;
  if(data.avgExp!==null && data.avgExp>0){
    const diff=data.st.exp-data.avgExp;
    const pct=Math.round(Math.abs(diff)/data.avgExp*100);
    const up=diff>0;
    const badgeTxt=`${up?'↑':'↓'} на ${pct}% ${up?'больше':'меньше'}, чем в среднем`;
    ctx.font=`700 32px ${F}`;
    const tw=ctx.measureText(badgeTxt).width;
    const bx=72,bw=tw+56,bh=64;
    ctx.fillStyle=up?'rgba(220,38,38,.35)':'rgba(5,150,105,.35)';
    rr(ctx,bx,cy,bw,bh,32);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.fillText(badgeTxt, bx+28, cy+43);
    cy+=bh+50;
  } else cy+=30;

  // топ категорий
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.font=`700 28px ${F}`;
  ctx.fillText('ТОП КАТЕГОРИЙ', 72, cy);
  cy+=36;

  const maxV=top.length?top[0][1]:1;
  top.forEach(([name,val],i)=>{
    const dotColor=cs.getPropertyValue('--'+CHART_HUES[i]).trim()||'#fff';
    const rowY=cy+i*96;
    ctx.fillStyle=dotColor||'#fff';
    ctx.beginPath();ctx.arc(88,rowY+8,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font=`600 34px ${F}`;
    ctx.fillText(fitText(ctx,name,W-122-260), 122, rowY+16);
    ctx.textAlign='right';
    ctx.fillText(fmt(val), W-72, rowY+16);
    ctx.textAlign='left';
    // мини-полоса
    const barY=rowY+34, barMaxW=W-144;
    ctx.fillStyle='rgba(255,255,255,.2)';
    rr(ctx,72,barY,barMaxW,10,5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.9)';
    rr(ctx,72,barY,Math.max(10,barMaxW*(val/maxV)),10,5);ctx.fill();
  });
  cy+=top.length*96+40;

  // самая крупная трата
  if(data.biggest){
    ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.font=`700 28px ${F}`;
    ctx.fillText('САМАЯ КРУПНАЯ ТРАТА', 72, cy);
    cy+=48;
    ctx.fillStyle='#fff';
    ctx.font=`700 40px ${F}`;
    ctx.fillText(fitText(ctx,txLabel(data.biggest),W-144), 72, cy);
    cy+=52;
    ctx.font=`800 56px ${F}`;
    ctx.fillText(fmt(share(data.biggest)), 72, cy);
    cy+=70;
  }

  // доходы / остаток — двумя плитками рядом
  const tileW=(W-72*2-24)/2, tileH=180;
  const free=data.st.inc-data.st.exp;
  [
    {lbl:'💚 Доходы', val:data.st.inc, x:72},
    {lbl:'📊 Остаток', val:free, x:72+tileW+24},
  ].forEach(t=>{
    ctx.fillStyle='rgba(255,255,255,.14)';
    rr(ctx,t.x,cy,tileW,tileH,24);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.font=`600 26px ${F}`;
    ctx.fillText(t.lbl, t.x+28, cy+52);
    ctx.fillStyle='#fff';
    ctx.font=`800 44px ${F}`;
    ctx.fillText(fitText(ctx,fmt(t.val),tileW-56), t.x+28, cy+118);
  });
  cy+=tileH+50;

  // подвал
  ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.font=`500 26px ${F}`;
  ctx.fillText('💜 Сделано в «Мой Бюджет»', 72, H-60);
}

function openMonthCard(){
  const data=monthCardData();
  const canvas=document.createElement('canvas');
  drawMonthCard(canvas,data);
  const dataUrl=canvas.toDataURL('image/png');
  document.getElementById('mo-card-body').innerHTML=`
    <div style="text-align:center">
      <img src="${dataUrl}" style="max-width:100%;border-radius:16px;box-shadow:var(--shadow)">
    </div>
    <a href="${dataUrl}" download="budget_${mName(data.m,data.y,true).replace('.','')}_${data.y}.png" class="btn btn-p" style="margin-top:14px;display:block;text-decoration:none;text-align:center">⬇️ Скачать картинку</a>
    <div class="gap8"></div>
    <button class="btn btn-g" onclick="closeModal('mo-card')">Закрыть</button>`;
  showModal('mo-card');
}

function rHistory(){
  const months=getMonths();
  if(!months.length)return`<div class="empty"><div class="ei">📅</div><p>Нет данных — добавь записи в Журнал</p></div>`;
  const cols=months.slice(0,4);
  const expCats=cfg.cats.filter(c=>c.t==='expense');
  const rows=[
    {k:'_inc',lbl:'💚 Доходы',tp:'inc'},
    ...expCats.map(c=>({k:c.n,lbl:c.n,tp:'exp'})),
    {k:'_tot',lbl:'ИТОГО РАСХОДОВ',tp:'tot'},
    {k:'_free',lbl:'📊 Остаток',tp:'free'},
  ];

  const stats=cols.map(({m,y})=>monthStats(m,y));

  let h=rInsights(cols,stats);

  h+=`<div class="card">
    <div class="card-hd">🧁 Расходы по категориям — ${mName(cols[0].m,cols[0].y)}</div>
    ${rCategoryBar(cols[0].m,cols[0].y)}
  </div>`;

  h+=`<div class="card">
    <div class="card-hd">📈 Динамика по месяцам</div>
    ${rTrendChart(cols,stats)}
  </div>`;

  h+=`<div class="card" style="overflow-x:auto;padding:12px 8px"><table class="htbl"><thead><tr>
    <th>Статья</th>
    ${cols.map(({m,y})=>`<th>${mName(m,y,true).replace('.','')}<br><small style="font-weight:400">${y}</small></th>`).join('')}
    ${cols.length>1?'<th>Среднее</th>':''}
  </tr></thead><tbody>`;

  rows.forEach(row=>{
    const vals=stats.map(st=>{
      if(row.k==='_inc')  return st.inc;
      if(row.k==='_tot')  return st.exp;
      if(row.k==='_free') return st.inc-st.exp;
      return st.cat[row.k]||0;
    });
    const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    const isTtl=row.k==='_tot';
    const isFree=row.k==='_free';
    const color=v=>{
      if(!v&&v!==0)return'—';
      if(row.tp==='inc'||isFree)return`<span style="color:var(--g)">${fmt(v)}</span>`;
      if(row.tp==='exp'||isTtl)return`<span style="color:var(--r)">${fmt(v)}</span>`;
      return fmt(v);
    };
    h+=`<tr class="${isTtl||isFree?'ttl':''}">
      <td>${row.lbl}</td>
      ${vals.map(v=>`<td>${color(v)}</td>`).join('')}
      ${cols.length>1?`<td>${color(Math.round(avg))}</td>`:''}
    </tr>`;
  });
  h+='</tbody></table></div>';
  return h;
}

  document.querySelectorAll('.ci[draggable]').forEach(el=>{
    el.addEventListener('dragstart',()=>{
      dragIdx=Number(el.dataset.ci);
      setTimeout(()=>el.classList.add('dragging'),0);
    });
    el.addEventListener('dragend',()=>{
      el.classList.remove('dragging');
      document.querySelectorAll('.ci').forEach(x=>x.classList.remove('drag-over'));
    });
    el.addEventListener('dragover',e=>{
      e.preventDefault();
      document.querySelectorAll('.ci').forEach(x=>x.classList.remove('drag-over'));
      el.classList.add('drag-over');
    });
    el.addEventListener('drop',e=>{
      e.preventDefault();
      const dropIdx=Number(el.dataset.ci);
      if(dragIdx!==null && dragIdx!==dropIdx){
        const [item]=cfg.cats.splice(dragIdx,1);
        cfg.cats.splice(dropIdx,0,item);
        LS.set(K.SET,cfg);
        render();
      }
    });
  });
}

function importD(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.txs){txs=d.txs;LS.set(K.TX,txs)}
      if(d.cfg){cfg=d.cfg;LS.set(K.SET,cfg)}
      if(d.accs){accs=d.accs;LS.set(K.ACC,accs)}

      alert('✅ Данные загружены!');render();
    }catch{alert('❌ Ошибка: неверный формат файла')}
  };
  r.readAsText(f);
}

// Ищем совпадения в уже сохранённых транзакциях (учится на твоих привычках):
// если похожее описание раньше уже относили к какой-то категории — предлагаем её,
// даже если формулировка чуть отличается (сравниваем в обе стороны, т.к. банк
// может присылать то более длинное, то более короткое описание одной и той же операции).
function suggestCategoryFromHistory(desc, isIncome){
  const d=(desc||'').trim().toLowerCase();
  if(d.length<3) return null;
  const freq={};
  for(const tx of txs){
    if(!tx.description) continue;
    // не путаем направление: возврат/поступление не должен подсказывать
    // категорию расхода (и наоборот), даже если текст описания похож
    if(isIncome!==undefined && (effectType(tx)==='income')!==isIncome) continue;
    const td=tx.description.trim().toLowerCase();
    if(td.length<3) continue;
    if(td.includes(d)||d.includes(td)){
      freq[tx.category]=(freq[tx.category]||0)+1;
    }
  }
  const best=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
  return best?best[0]:null;
}

// Автосаджест категории по описанию
function autosuggestCat(){
  const desc=(document.getElementById('f-desc')?.value||'').trim();
  const sel=document.getElementById('f-cat');
  if(!sel||sel.value||desc.length<3)return;

  // 1) сперва ищем совпадения в прошлых транзакциях
  const isIncome=fTxType==='income';
  const fromHistory=suggestCategoryFromHistory(desc,isIncome);
  if(fromHistory&&sel.querySelector(`option[value="${CSS.escape(fromHistory)}"]`)){
    sel.value=fromHistory;
    return;
  }

  // 2) если истории нет — используем словарь ключевых слов
  const guess=guessCategory(desc,isIncome);
  if(guess&&guess!=='❓ Уточнить'&&sel.querySelector(`option[value="${CSS.escape(guess)}"]`)){
    sel.value=guess;
  }
}

function saveTx(e){
  if(e) e.stopPropagation();
  const cat=document.getElementById('f-cat').value;
  const amt=parseFloat(document.getElementById('f-amt').value);
  const date=document.getElementById('f-date').value;
  let ok=true;
  if(!cat){document.getElementById('f-cat').classList.add('err');ok=false}
  if(!amt||amt<=0){document.getElementById('f-amt').classList.add('err');ok=false}
  if(!date){document.getElementById('f-date').classList.add('err');ok=false}
  if(!ok)return;

  const debtType=document.getElementById('f-debt').value||null;
  const debtPerson=document.getElementById('f-dperson')?.value?.trim()||null;
  const debtAmt=parseFloat(document.getElementById('f-damt')?.value)||null;
  const splitAmt=fSplit==='c'?(parseFloat(document.getElementById('f-split-amt')?.value)||0):0;

  // сохраняем имя должника в список
  if(debtPerson && !dNames.includes(debtPerson)){
    dNames.push(debtPerson);
    LS.set(K.DN, dNames);
  }

  const data={
    category:cat,
    type:catType(cat),
    txType:fTxType||undefined,
    description:document.getElementById('f-desc').value.trim(),
    amount:amt,
    date,
    split:fSplit,
    splitAmt:splitAmt||undefined,
    debtType,
    debtPerson,
    debtAmount:debtAmt,
    include:fInclude,
    comment:document.getElementById('f-comment').value.trim(),
  };

  let recatCount=0;
  if(editId){
    const i=txs.findIndex(t=>t.id===editId);
    if(i>=0)txs[i]={...txs[i],...data};

    // Категорию поправили вручную — подтягиваем то же исправление на все
    // остальные операции с таким же описанием, которые ещё сидят в старой
    // (неверной) категории, чтобы не чинить одно и то же по сто раз руками.
    if(editOrigCat && data.category!==editOrigCat && normDesc(data.description).length>=3){
      const nd=normDesc(data.description);
      txs.forEach(t=>{
        if(t.id!==editId && normDesc(t.description)===nd && t.category===editOrigCat){
          t.category=data.category;
          t.type=catType(data.category);
          recatCount++;
        }
      });
    }
  } else {
    txs.unshift({id:uid(),...data});
  }
  LS.set(K.TX,txs);
  closeModal('mo-tx');
  render();
  if(recatCount>0){
    const n1=recatCount%10, n100=recatCount%100;
    const word=(n1===1&&n100!==11)?'операции':((n1>=2&&n1<=4&&(n100<12||n100>14))?'операции':'операций');
    toast(`Категория обновлена ещё у ${recatCount} ${word} с таким же описанием`);
  }
}
